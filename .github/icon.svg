<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient
      id="andhivieCrimson"
      x1="19"
      y1="49"
      x2="45"
      y2="15"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#BE123C" />
      <stop offset="1" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient
      id="andhivieGold"
      x1="8"
      y1="32"
      x2="56"
      y2="32"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#D4A883" stop-opacity="0.15" />
      <stop offset="0.5" stop-color="#D4A883" stop-opacity="0.55" />
      <stop offset="1" stop-color="#D4A883" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Latar belakang gelap dengan sudut membulat (app icon style) -->
  <rect width="64" height="64" rx="14" fill="#0F0A0A" />

  <!-- Bingkai emas halus (premium accent) -->
  <rect
    x="1.5"
    y="1.5"
    width="61"
    height="61"
    rx="12.5"
    stroke="url(#andhivieGold)"
    stroke-width="1"
    fill="none"
  />

  <!-- Huruf "A" — bold geometric, gradient crimson -->
  <path
    d="M19 49 L32 15 L45 49"
    stroke="url(#andhivieCrimson)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Crossbar emas — signature accent -->
  <path
    d="M25 37 L39 37"
    stroke="#D4A883"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>